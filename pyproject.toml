[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alvenus"
version = "0.0.1"
description = "Free, local script-to-cut video editing: best take per script line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime", "pillow"]

[project.scripts]
alvenus = "alvenus.cli:main"

[tool.setuptools]
packages = ["alvenus"]

[tool.setuptools.package-data]
alvenus = ["fonts/*.otf", "fonts/*.ttf", "fonts/OFL.txt", "studio.html", "studio_fonts/*.woff2", "studio_fonts/*.txt", "studio_fonts/*.png", "studio_fonts/*.svg", "studio_fonts/*.ico", "addons/README.md", "addons/styles/*.json", "addons/recipes/*.json"]

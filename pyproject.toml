[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alvenus"
dynamic = ["version"]
description = "Free, local script-to-cut video editing: best take per script line."
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime", "pillow"]

[project.scripts]
alvenus = "alvenus.cli:main"

[tool.setuptools.dynamic]
version = { attr = "alvenus.__version__" }

[tool.setuptools.packages.find]
include = ["alvenus*"]
namespaces = true

[tool.setuptools.package-data]
alvenus = ["fonts/*.otf", "fonts/*.ttf", "fonts/OFL.txt", "studio.html", "studio_home.html", "studio_fonts/*.woff2", "studio_fonts/*.txt", "studio_fonts/*.png", "studio_fonts/*.svg", "studio_fonts/*.ico", "addons/README.md", "addons/styles/*.json", "addons/recipes/*.json", "icons/*.json.gz", "icons/*.txt", "mark/*.png"]

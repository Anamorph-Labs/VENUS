[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alvenus"
version = "0.0.1"
description = "Free, local script-to-cut video editing: best take per script line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime"]

[project.scripts]
alvenus = "alvenus.cli:main"

[tool.setuptools]
packages = ["alvenus"]
